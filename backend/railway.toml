# Railway config for the backend service (monorepo: set Root Directory = backend in the dashboard too)
# Docs: https://docs.railway.com/guides/monorepo

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
